<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Content Calendar</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="container">

<header class="top-header-bar" role="navigation" aria-label="Primary menu">
    <div class="top-header-inner">
        <div class="top-header-left">
            <img class="top-brand-logo" src="icon/HueSixteen.png" alt="HueSixteen logo">
            <span class="top-brand-name">HueSixteen</span>
        </div>
        <nav class="top-header-middle" aria-label="Primary menu links">
            <a class="top-menu-link active" href="index.html" aria-current="page">Content Calendar</a>
            <a class="top-menu-link" href="client.html">Clients</a>
        </nav>
        <div class="top-header-right">
            <div class="notification-center" id="notificationCenter">
                <button class="notification-btn" id="notificationBtn" title="Upcoming in 24 hours" onclick="toggleNotificationPanel(event)">
                    <svg class="icon-svg icon-bell" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M14.5 17H5.5a.5.5 0 0 1-.42-.78L6.5 14V10a5.5 5.5 0 0 1 11 0v4l1.42 2.22a.5.5 0 0 1-.42.78h-4" />
                        <path d="M10 19a2 2 0 0 0 4 0" />
                    </svg>
                    <span class="notification-count" id="notificationCount">0</span>
                </button>
                <div class="notification-panel" id="notificationPanel">
                    <div class="notification-panel-header">
                        <h3>Upcoming 24 Hours</h3>
                        <span class="notification-total" id="notificationTotal">0</span>
                    </div>
                    <div class="notification-list" id="notificationList"></div>
                </div>
            </div>
            <div class="profile-menu" id="profileMenu">
                <button class="profile-btn" id="profileBtn" type="button" title="Profile options" onclick="toggleProfileMenu(event)">
                    <svg class="icon-svg" viewBox="0 0 24 24" aria-hidden="true">
                        <circle cx="12" cy="8" r="3.5" />
                        <path d="M5 20a7 7 0 0 1 14 0" />
                    </svg>
                </button>
                <div class="profile-dropdown" id="profileDropdown">
                    <button class="profile-dropdown-item" type="button" onclick="closeProfileMenu(); refreshPage();">Refresh</button>
                    <button class="profile-dropdown-item danger" type="button" onclick="closeProfileMenu(); logout();">Logout</button>
                </div>
            </div>
            <div class="header-menu-wrap">
                <button class="header-menu-btn" id="headerMenuBtn" type="button" aria-label="Open menu" onclick="toggleHeaderDrawer(event)">
                    <svg class="icon-svg" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M4 7h16" />
                        <path d="M4 12h16" />
                        <path d="M4 17h16" />
                    </svg>
                </button>
            </div>
        </div>
    </div>
</header>

<div class="mobile-drawer-overlay" id="mobileDrawerOverlay" onclick="handleMobileDrawerOverlay(event)">
    <aside class="mobile-drawer" id="mobileDrawer" aria-label="Mobile menu">
        <div class="mobile-drawer-head">
            <span class="mobile-drawer-title">Menu</span>
            <button class="mobile-drawer-close" type="button" aria-label="Close menu" onclick="closeHeaderDrawer()">×</button>
        </div>
        <nav class="mobile-drawer-nav" aria-label="Mobile primary menu">
            <a class="mobile-drawer-link active" href="index.html" aria-current="page" onclick="closeHeaderDrawer()">Content Calendar</a>
            <a class="mobile-drawer-link" href="client.html" onclick="closeHeaderDrawer()">Clients</a>
        </nav>
    </aside>
</div>

<div class="header">
    <div class="header-content">
        <h1>Content Calendar</h1>
        <p>June 2026 - September 2026</p>
    </div>
</div>

<div class="pills">
    <button class="pill upcoming-pill active" onclick="switchTab(event,'upcoming')">
        <img class="pill-icon" src="icon/Upcoming.png" alt="" aria-hidden="true">
        <span>Upcoming</span>
    </button>
    <button class="pill" onclick="switchTab(event,'dribbble')">
        <img class="pill-icon" src="icon/dribbble.png" alt="" aria-hidden="true">
        <span>Dribbble</span>
    </button>
    <button class="pill" onclick="switchTab(event,'fafb')">
        <img class="pill-icon" src="icon/facebook.png" alt="" aria-hidden="true">
        <span>Faysal</span>
    </button>
    <button class="pill" onclick="switchTab(event,'linkedin')">
        <img class="pill-icon" src="icon/Linkedin.png" alt="" aria-hidden="true">
        <span>Faysal</span>
    </button>
    <button class="pill" onclick="switchTab(event,'huefb')">
        <img class="pill-icon" src="icon/facebook.png" alt="" aria-hidden="true">
        <span>HueSixteen</span>
    </button>
    <button class="pill" onclick="switchTab(event,'hueig')">
        <img class="pill-icon" src="icon/instagram.png" alt="" aria-hidden="true">
        <span>Hue Sixteen</span>
    </button>
    <button class="pill" onclick="switchTab(event,'hueli')">
        <img class="pill-icon" src="icon/Linkedin.png" alt="" aria-hidden="true">
        <span>Hue Sixteen</span>
    </button>
    <button class="pill" onclick="switchTab(event,'hueth')">
        <img class="pill-icon" src="icon/threads.webp" alt="" aria-hidden="true">
        <span>Hue Sixteen</span>
    </button>
</div>

<div class="card" id="platformCard">
    <h2 class="platform-title" id="title"></h2>
    <div class="platform-info" id="info"></div>
</div>

<div class="card">
    <h3 class="month-title">June 2026</h3>
    <div class="calendar" id="juneCalendar"></div>
</div>

<div class="card">
    <h3 class="month-title">July 2026</h3>
    <div class="calendar" id="julyCalendar"></div>
</div>

<div class="card">
    <h3 class="month-title">August 2026</h3>
    <div class="calendar" id="augustCalendar"></div>
</div>

<div class="card">
    <h3 class="month-title">September 2026</h3>
    <div class="calendar" id="septemberCalendar"></div>
</div>

<div class="card">
    <h3 style="margin-bottom:10px;">Notes</h3>
    <div class="notes" id="notes"></div>
</div>

<div class="card upcoming-section" id="upcomingSection">
    <h2 class="platform-title">Upcoming Content</h2>
    <p style="color:#6b7280;margin-bottom:24px;">Next 7 days</p>
    <div class="upcoming-grid" id="upcomingGrid"></div>
    <div class="upcoming-legend" id="upcomingLegend"></div>
</div>

</div>

<div class="modal-overlay" id="modal">
    <div class="modal-content">
        <div class="modal-header" id="modalPlatform"></div>
        <div class="modal-date" id="modalDate"></div>
        <div class="modal-posts">
            <div class="modal-posts-title">Posts Scheduled:</div>
            <div id="modalPostsList" style="display: flex; align-items: center; gap: 10px; position: relative;">
                <div id="topicDisplay" style="flex: 1;"></div>
                <button id="colorPickerBtn" class="color-picker-btn" onclick="openColorPickerModal()" title="Change color">🎨</button>
                <button id="editTopicBtn" class="edit-topic-btn" onclick="toggleEditTopic()" title="Edit topic">✎</button>
            </div>
            <div id="editTopicContainer" style="display: none; gap: 8px; margin-top: 8px;">
                <input type="text" id="topicInput" placeholder="Enter new topic name" style="flex: 1; padding: 8px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px;">
                <button class="save-topic-btn" onclick="saveTopicName()">Save</button>
                <button class="cancel-topic-btn" onclick="cancelEditTopic()">Cancel</button>
            </div>
        </div>
        <div class="modal-status">
            <label for="statusDropdown">Status:</label>
            <select id="statusDropdown">
                <option value="pending">Pending</option>
                <option value="working">Working</option>
                <option value="done">Done</option>
            </select>
        </div>
        <div class="modal-note">
            <label for="noteInput">Note:</label>
            <textarea id="noteInput" placeholder="Add a note for this post"></textarea>
        </div>
        <div class="modal-buttons">
            <button class="modal-ok" onclick="saveStatus()">OK</button>
            <button class="modal-close" onclick="closeModal()">Close</button>
        </div>
    </div>
</div>

<!-- Color Picker Modal -->
<div class="color-picker-overlay" id="colorPickerOverlay">
    <div class="color-picker-modal">
        <div class="color-picker-header">
            <h3>Select Color</h3>
            <button class="color-picker-close" onclick="closeColorPickerModal()">×</button>
        </div>
        <div class="color-picker-content">
            <div class="color-gradient-container">
                <div class="color-gradient" id="colorGradient">
                    <div class="color-selector-circle" id="colorSelectorCircle"></div>
                </div>
                <div class="color-slider-container">
                    <input type="range" id="colorHue" min="0" max="360" value="0" class="color-hue-slider">
                </div>
            </div>
            <div class="color-presets">
                <div class="preset-colors"></div>
            </div>
            <div class="color-hex-input">
                <label>Hex Color:</label>
                <input type="text" id="hexInput" placeholder="#000000" maxlength="7">
            </div>
        </div>
        <div class="color-picker-footer">
            <button class="color-picker-ok" onclick="applySelectedColor()">OK</button>
            <button class="color-picker-cancel" onclick="closeColorPickerModal()">Cancel</button>
        </div>
    </div>
</div>

<script src="script.js"></script>

</body>
</html>
